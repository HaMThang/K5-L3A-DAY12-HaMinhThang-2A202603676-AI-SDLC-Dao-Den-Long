function sphereMesh(){let p=[],n=[];for(let lat=0;lat<12;lat++)for(let lon=0;lon<20;lon++){let v0=lat*Math.PI/12,v1=(lat+1)*Math.PI/12,u0=lon*Math.PI/10,u1=(lon+1)*Math.PI/10;let f=(v,u)=>[Math.sin(v)*Math.cos(u),Math.cos(v),Math.sin(v)*Math.sin(u)];let a=f(v0,u0),b=f(v1,u0),c=f(v1,u1),d=f(v0,u1);for(let q of [a,b,c,a,c,d]){p.push(...q);n.push(...q)}}return makeMesh(p,n)}

let target=state.lanterns.filter(l=>!l.lit).sort((a,b)=>Math.hypot(a.pos[0]-player[0],a.pos[2]-player[2])-Math.hypot(b.pos[0]-player[0],b.pos[2]-player[2]))[0];if(target){let vx=target.pos[0]-player[0],vz=target.pos[2]-player[2],side=vx*Math.cos(theta)-vz*Math.sin(theta),front=-vx*Math.sin(theta)-vz*Math.cos(theta),angle=Math.atan2(side,front);document.getElementById('arrow').textContent=Math.abs(angle)>.7?(angle>0?'🏮 →':'← 🏮'):''}else document.getElementById('arrow').textContent='';

else if(state.night===2){for(let x of [0,70]){draw([x,-.1,0],[28,1,28],sea,true);draw([x,0,0],[28,.02,28],grass,true)}draw([35,0,0],[18,.3,4],wood);drawRuins(state.obstacles||[]);drawPalm(-12,-10,.82);drawPalm(10,8,.82);drawPalm(8,13,.82);drawPalm(57,-10,.82);drawPalm(82,9,.82);drawPalm(72,13,.82);drawPalm(-18,4,.68);drawPalm(13,-20,.72);drawPalm(54,1,.7);drawPalm(78,21,.72);springPad(20,18);springPad(50,-18)}
else{draw([0,-.1,0],[45,1,45],sea,true);draw([0,0,0],[44,.03,44],grass,true);drawTier();draw([0,6,0],[8,.2,8],grass,true);drawPagoda(wood);drawRuins(state.obstacles||[]);for(let i=0;i<18;i++){let a=i*2.4,r=29+(i%3)*3,x=r*Math.cos(a),z=r*Math.sin(a);drawMesh(cylinder,[x,1.45,z],[.42,2.9,.42],[82/255,57/255,40/255]);for(const [yy,w,h,c] of [[2.25,2.25,2.7,[12/255,67/255,45/255]],[3.45,1.95,2.35,[18/255,89/255,54/255]],[4.55,1.48,2.0,[25/255,108/255,62/255]],[5.5,.9,1.55,[39/255,124/255,68/255]]])drawMesh(cone,[x,yy,z],[w,h,w],c)}for(let deg of [30,150])for(let r=24;r<30;r+=1.5){let a=deg*Math.PI/180,y=(30-r)/2;draw([r*Math.cos(a),y,r*Math.sin(a)],[1.5,.18,3],wood)}springPad(0,13,3)}
if(state.night===1){drawHouse(-26,26);drawHouse(36,-4)}else if(state.night===2){drawHouse(-23,5);drawHouse(94,5)}else{drawHouse(-2,-18);drawHouse(-12,-14)}
if(environmentNight!==state.night){environmentNight=state.night;environmentMeshes=buildEnvironment(state)}for(const [mesh,color] of environmentMeshes)drawMesh(mesh,[0,0,0],[1,1,1],color);
for(const l of state.lanterns)drawLanternModel(l.pos[0],l.pos[1],l.pos[2],Number(l.fuel||0),l.lit,time,1,true,Number(l.deposited||0));
gl.depthMask(false);for(const m of state.motes)drawSprite([m.pos[0],m.pos[1]+.85+.12*Math.sin(time/300+m.pos[0]),m.pos[2]],.96,1.14,theta);gl.depthMask(true);

for(const dr of state.drifters){if(dr.state!=='removed')draw([dr.pos[0],dr.pos[1]+1,dr.pos[2]],[1,.3,.5],[143/255,163/255,184/255])}
drawPlayer(player);
elapsed+=dt;if(elapsed>=1/60&&!busy&&screen==='play'){elapsed=0;busy=true;const input={move:[Number(!!keys.KeyD)-Number(!!keys.KeyA),Number(!!keys.KeyS)-Number(!!keys.KeyW)],cam_yaw_deg:yaw,jump:!!keys.Space,dash:!!keys.ShiftLeft,interact:!!keys.KeyE,pulse:!!keys.KeyJ,pause:!!keys.KeyP||!!keys.Escape};fetch('/step',{method:'POST',body:JSON.stringify(input)}).then(r=>r.json()).then(data=>{state=data.snapshot;events=data.events;totalScore=data.total_score;updateHUD()}).finally(()=>busy=false)}
}
function updateHUD(){if(!state)return;let lit=state.lanterns.filter(x=>x.lit).length,seconds=Math.ceil(state.time_left_s),mm=String(Math.floor(seconds/60)).padStart(2,'0'),ss=String(seconds%60).padStart(2,'0');document.getElementById('flames').textContent='🔥'.repeat(state.player.flames);document.getElementById('timer').textContent=`${mm}:${ss}`;document.getElementById('timer').classList.toggle('danger',seconds<=30);document.getElementById('progress').textContent=`🏮 ${lit}/${state.lanterns.length} · ⭐ ${totalScore}`;document.getElementById('cells').textContent='●'.repeat(state.player.carried)+'○'.repeat(Math.max(0,(state.player.capacity||10)-state.player.carried));document.getElementById('cooldowns').textContent=`Lướt ${state.player.dash_cd_s.toFixed(1)}s · Tỏa sáng ${state.player.pulse_cd_s.toFixed(1)}s`;let near=state.lanterns.filter(l=>(!l.lit||(l.fuel||0)<100)&&Math.hypot(l.pos[0]-state.player.pos[0],l.pos[2]-state.player.pos[2])<=2)[0];document.getElementById('prompt').textContent=near?`E — ${near.lit?'Châm dầu':'Nạp ánh sáng'} (${near.lit?near.fuel+'%':near.deposited+'/10'})`:'';if(events.length){let last=events.at(-1);document.getElementById('message').textContent=({mote_picked:'Đã nhặt đom đóm!',deposit:'Đã nạp ánh sáng!',refuel:'Đã châm dầu!',lantern_out:'Đèn đã cạn dầu!',lantern_lit:'Đèn lồng đã sáng!',pulse:'Tỏa Sáng!',player_hit:'Mây mất Ngọn Lửa!',dash:'Lướt!',charm_picked:'Đã nhặt Bùa Gió!',drifter_steal:'Gió Lạc cướp đom đóm!',game_over:'Kết thúc Đêm!'})[last.name]||'';tone(last.name==='game_over'?220:540)}if(state.state==='paused'&&screen==='play'){screen='pause';pauseMenu()}if(['won','lost'].includes(state.state)&&screen==='play'){screen='result';let title=state.state==='won'?(state.night===3?'Bình Minh!':`${names[state.night]} bừng sáng!`):'Đêm đã kết thúc';let next=state.state==='won'&&state.night<3?`<button onclick="intro(${state.night+1})">Đêm kế tiếp</button>`:'';show(title,`Điểm Đêm: ${state.score} · Tổng điểm: ${totalScore}`,`${next}<button on
